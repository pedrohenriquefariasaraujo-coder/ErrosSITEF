<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiTef CyberScan // Diagnóstico de Erros</title>
    <!-- Google Fonts Futuristas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #060913;
            --panel-bg: rgba(13, 22, 38, 0.8);
            --primary-neon: #00f3ff;
            --secondary-neon: #9d00ff;
            --success-neon: #00ff66;
            --danger-neon: #ff0055;
            --text-color: #c0e0ff;
            --text-muted: #6482a6;
            --border-glow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Grelha de Fundo Dinâmica */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -2;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* Efeito de Scanline de TV/Monitor Futurista */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Painel Principal Cyber HUD */
        .container {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 35px;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), var(--border-glow);
            position: relative;
            clip-path: polygon(
                0 15px, 15px 0, 
                calc(100% - 15px) 0, 100% 15px, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                15px 100%, 0 calc(100% - 15px)
            );
        }

        .container::before {
            content: "SYSTEM DIAGNOSTICS // ONLINE";
            position: absolute;
            top: 10px;
            right: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--primary-neon);
            opacity: 0.7;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary-neon), 0 0 20px var(--primary-neon);
            margin-bottom: 8px;
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            background: rgba(4, 10, 22, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 4px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        input[type="text"]:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5), inset 0 0 10px rgba(0, 243, 255, 0.2);
        }

        input[type="text"]::placeholder {
            color: rgba(100, 130, 166, 0.6);
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0;
            font-size: 15px;
        }

        button {
            padding: 14px 28px;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(157, 0, 255, 0.3));
            border: 1px solid var(--primary-neon);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        button:hover {
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
            color: #000;
        }

        button:active {
            transform: scale(0.97);
        }

        /* Cartão de Resultado Futurista */
        .result-card {
            background: rgba(6, 15, 30, 0.9);
            border: 1px solid var(--primary-neon);
            border-left: 5px solid var(--primary-neon);
            border-radius: 4px;
            padding: 25px;
            margin-top: 20px;
            display: none;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary-neon);
            font-size: 18px;
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding-bottom: 12px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .result-field {
            margin: 14px 0;
            font-size: 18px;
            line-height: 1.5;
            display: flex;
            align-items: flex-start;
        }

        .field-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700; 
            color: var(--text-muted); 
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 180px;
            padding-top: 2px;
        }

        .field-content {
            flex: 1;
            color: #e0f0ff;
        }

        /* Badges Neon */
        .badge-retentativa {
            padding: 4px 12px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-sim { 
            background: rgba(0, 255, 102, 0.15); 
            color: var(--success-neon); 
            border: 1px solid var(--success-neon);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .badge-nao { 
            background: rgba(255, 0, 85, 0.15); 
            color: var(--danger-neon); 
            border: 1px solid var(--danger-neon);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }

        .no-result {
            color: var(--danger-neon);
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--danger-neon);
            padding: 16px;
            border-radius: 4px;
            text-align: center;
            display: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
            animation: slideIn 0.3s ease-out;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-green { background-color: var(--success-neon); box-shadow: 0 0 6px var(--success-neon); }
        .dot-red { background-color: var(--danger-neon); box-shadow: 0 0 6px var(--danger-neon); }
    </style>
</head>

    function buscarErro() {
        let codigo = document.getElementById("codigoErro").value.trim().toUpperCase();
        const cardResultado = document.getElementById("resultado");
        const divNaoEncontrado = document.getElementById("naoEncontrado");

        // Limpa visualização anterior
        cardResultado.style.display = "none";
        divNaoEncontrado.style.display = "none";

        if (codigo === "") {
            alert("Por favor, digite um código de erro.");
            return;
        }

        // Adiciona zero à esquerda se for numérico de 1 dígito
        if (codigo.length === 1 && !isNaN(codigo)) {
            codigo = "0" + codigo;
        }

        // Realiza a consulta na base
        if (baseErros[codigo]) {
            const erro = baseErros[codigo];
            
            document.getElementById("resCodigo").innerText = "CÓDIGO DE ERRO: " + codigo;
            document.getElementById("resDescricao").innerText = erro.descricao;
            document.getElementById("resAcao").innerText = erro.acao;
            
            // Renderiza o badge futurista Sim/Não
            const bRetentativa = document.getElementById("resRetentativa");
            if(erro.retentativa === "Sim") {
                bRetentativa.innerHTML = '<span class="badge-retentativa badge-sim"><span class="dot dot-green"></span> SIM</span>';
            } else {
                bRetentativa.innerHTML = '<span class="badge-retentativa badge-nao"><span class="dot dot-red"></span> NÃO</span>';
            }
            
            cardResultado.style.display = "block";
        } else {
            divNaoEncontrado.style.display = "block";
        }
    }

    function verificarEnter(event) {
        if (event.key === "Enter") {
            buscarErro();
        }
    }
