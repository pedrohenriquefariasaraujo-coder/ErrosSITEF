<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Erros SiTef Completo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
        }
        h1 {
            color: #0056b3;
            font-size: 24px;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #0056b3;
        }
        button {
            padding: 12px 25px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #004085;
        }
        .result-card {
            border-left: 5px solid #0056b3;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 0 4px 4px 0;
            margin-top: 15px;
            display: none;
        }
        .result-card h3 {
            margin-top: 0;
            color: #0056b3;
            font-size: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .result-field {
            margin: 12px 0;
            line-height: 1.6;
        }
        .field-title { 
            font-weight: bold; 
            color: #495057; 
            display: inline-block;
            width: 160px;
        }
        .badge-retentativa {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
        }
        .badge-sim { background-color: #d4edda; color: #155724; }
        .badge-nao { background-color: #f8d7da; color: #721c24; }
        .no-result {
            color: #721c24;
            background-color: #f8d7da;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="subtitle">Base de dados completa atualizada</div>
    
    <div class="search-box">
        <input type="text" id="codigoErro" placeholder="Ex: 05, 51, AA, -1..." onkeypress="verificarEnter(event)" autofocus>
        <button onclick="buscarErro()">Pesquisar</button>
    </div>

    <div id="resultado" class="result-card">
        <h3 id="resCodigo">Código: XX</h3>
        <div class="result-field">
            <span class="field-title">Descrição:</span> 
            <span id="resDescricao"></span>
        </div>
        <div class="result-field">
            <span class="field-title">Ação - O que fazer:</span> 
            <span id="resAcao"></span>
        </div>
        <div class="result-field">
            <span class="field-title">Permite Retentativa?</span> 
            <span id="resRetentativa"></span>
        </div>
    </div>

    <div id="naoEncontrado" class="no-result">
        ⚠️ Código de erro não localizado na base cadastrada.
    </div>
</div>

    function buscarErro() {
        let codigo = document.getElementById("codigoErro").value.trim().toUpperCase();
        const cardResultado = document.getElementById("resultado");
        const divNaoEncontrado = document.getElementById("naoEncontrado");

        // Limpa visualização anterior
        cardResultado.style.display = "none";
        divNaoEncontrado.style.display = "none";

        if (codigo === "") {
            alert("Por favor, digite um código de erro.");
            return;
        }

        // Inteligência para adicionar o zero à esquerda caso o usuário digite apenas 1 dígito numérico (Ex: de "5" para "05")
        if (codigo.length === 1 && !isNaN(codigo)) {
            codigo = "0" + codigo;
        }

        // Realiza a consulta na base
        if (baseErros[codigo]) {
            const erro = baseErros[codigo];
            
            document.getElementById("resCodigo").innerText = "Código de Erro: " + codigo;
            document.getElementById("resDescricao").innerText = erro.descricao;
            document.getElementById("resAcao").innerText = erro.acao;
            
            // Renderiza o badge Sim/Não para facilitar a identificação visual
            const bRetentativa = document.getElementById("resRetentativa");
            if(erro.retentativa === "Sim") {
                bRetentativa.innerHTML = '<span class="badge-retentativa badge-sim">Sim</span>';
            } else {
                bRetentativa.innerHTML = '<span class="badge-retentativa badge-nao">Não</span>';
            }
            
            cardResultado.style.display = "block";
        } else {
            divNaoEncontrado.style.display = "block";
        }
    }

    // Atalho para pesquisar ao pressionar Enter
    function verificarEnter(event) {
        if (event.key === "Enter") {
            buscarErro();
        }
    }
